<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E2869">
<meta name="description" content="Catatan keuangan pribadi: rekening, pemasukan, pengeluaran, tabungan & emas, scan struk.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Financial Freedom">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Financial Freedom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column phone app shell (max 480px), sticky header, bottom tab bar with raised center action, bottom sheets for every form. */
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --surface2:#E9ECF5; --fg:#141A33; --muted:#5F6784; --line:#DADFEC;
  --accent:#2C3990; --accent-soft:#E2E6FA; --accent-fg:#FFFFFF;
  --hero:#1E2869; --hero-fg:#F4F5FF; --hero-muted:#B9C0F0;
  --gold:#A87A1E; --gold-soft:#F6EBD3;
  --in:#11865A; --in-soft:#DDF3EA; --out:#CC3F35; --out-soft:#FBE3E1;
  --shadow:0 1px 2px rgba(20,26,51,.06),0 8px 24px rgba(20,26,51,.06);
  --c1:#2C3990; --c2:#E0703A; --c3:#11865A; --c4:#C2417E; --c5:#2F8FB8; --c6:#A87A1E; --c7:#7A4FC4; --c8:#5E8A1E; --c9:#D3A11A; --c10:#7C8299;
  --display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F1E; --surface:#141A30; --surface2:#1C2340; --fg:#E8EBF7; --muted:#9AA2C2; --line:#283052;
  --accent:#93A0FF; --accent-soft:#232C5A; --accent-fg:#0B0F1E;
  --hero:#1F2A72; --hero-fg:#F4F5FF; --hero-muted:#B3BBF2;
  --gold:#E2B65C; --gold-soft:#33291A;
  --in:#3ED39A; --in-soft:#143329; --out:#FF7B70; --out-soft:#3A1D1E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --c1:#93A0FF; --c2:#FF9A63; --c3:#3ED39A; --c4:#F07AB2; --c5:#5EC3EC; --c6:#E2B65C; --c7:#B293FF; --c8:#A4D45A; --c9:#FFD34E; --c10:#8F96B3;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0F1E; --surface:#141A30; --surface2:#1C2340; --fg:#E8EBF7; --muted:#9AA2C2; --line:#283052;
  --accent:#93A0FF; --accent-soft:#232C5A; --accent-fg:#0B0F1E;
  --hero:#1F2A72; --hero-fg:#F4F5FF; --hero-muted:#B3BBF2;
  --gold:#E2B65C; --gold-soft:#33291A;
  --in:#3ED39A; --in-soft:#143329; --out:#FF7B70; --out-soft:#3A1D1E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --c1:#93A0FF; --c2:#FF9A63; --c3:#3ED39A; --c4:#F07AB2; --c5:#5EC3EC; --c6:#E2B65C; --c7:#B293FF; --c8:#A4D45A; --c9:#FFD34E; --c10:#8F96B3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button,[data-act],[data-tab],label{cursor:pointer;touch-action:manipulation}
button *{pointer-events:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:34px;height:34px;border-radius:11px;background:var(--hero);display:grid;place-items:center;color:var(--gold)}
.logo svg{width:20px;height:20px}
.brand b{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:-2px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg)}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-block:2px 14px}
.monthbar .m{font-weight:700;font-size:15px}
.monthbar button{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center;color:var(--fg)}
.monthbar button:disabled{opacity:.35;cursor:default}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;background:var(--hero);color:var(--hero-fg);padding:20px 20px 18px;display:grid;gap:16px}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle at 0 0,rgba(255,255,255,.09) 0 9px,transparent 10px),radial-gradient(circle at 100% 0,rgba(255,255,255,.09) 0 9px,transparent 10px),radial-gradient(circle at 0 100%,rgba(255,255,255,.09) 0 9px,transparent 10px),radial-gradient(circle at 100% 100%,rgba(255,255,255,.09) 0 9px,transparent 10px),radial-gradient(circle at 50% 50%,rgba(226,182,92,.22) 0 1.6px,transparent 2.4px);
  background-size:26px 26px;-webkit-mask-image:linear-gradient(110deg,transparent 35%,#000 100%);mask-image:linear-gradient(110deg,transparent 35%,#000 100%)}
.hero>*{position:relative;z-index:1}
.hero .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--hero-muted);font-weight:600}
.hero .big{font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,38px);letter-spacing:-.03em;line-height:1.05;margin-top:4px}
.hero .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .pill{background:rgba(255,255,255,.08);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;min-width:0}
.hero .pill .dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.hero .pill .dot.in{background:#1C8F63;color:#fff}.hero .pill .dot.out{background:#D4554B;color:#fff}
.hero .pill small{display:block;font-size:11px;color:var(--hero-muted)}
.hero .pill b{display:block;font-size:13px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* sections */
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:8px}
.sec-h h2{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0}
.link{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:6px}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.quick button{border:0;background:var(--surface);border-radius:18px;padding:12px 4px 10px;display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:600;box-shadow:var(--shadow);color:var(--fg)}
.qi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.qi.out{background:var(--out-soft);color:var(--out)}.qi.in{background:var(--in-soft);color:var(--in)}.qi.scan{background:var(--accent-soft);color:var(--accent)}.qi.gold{background:var(--gold-soft);color:var(--gold)}.qi.tf{background:var(--surface2);color:var(--fg)}

.budget .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted)}
.budget .row b{color:var(--fg);font-size:15px}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s}
.bar.warn>i{background:var(--gold)}.bar.over>i{background:var(--out)}
.rowcard{width:100%;border:0;text-align:left;display:flex;gap:12px;align-items:center;color:var(--fg)}
.rowcard .grow{flex:1;min-width:0}
.rowcard small{color:var(--muted);display:block;font-size:12.5px}

/* accounts */
.acc-strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:2px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.acc-strip::-webkit-scrollbar{display:none}
.acc-card{flex:none;width:158px;scroll-snap-align:start;border:0;background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);text-align:left;display:grid;gap:10px;color:var(--fg)}
.acc-card .top2{display:flex;justify-content:space-between;align-items:center}
.acc-card .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-card .bl{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-card .no{font-size:11px;color:var(--muted)}
.acc-card.add{border:2px dashed var(--line);background:none;box-shadow:none;place-items:center;align-content:center;color:var(--muted);font-weight:600;font-size:13px}
.acc-row{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);color:var(--fg)}
.acc-row .meta{min-width:0}
.acc-row .meta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-row .meta small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-row .val{text-align:right;font-weight:700;font-size:14px;white-space:nowrap}
.acc-row .val small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.neg{color:var(--out)}

/* tx list */
.tx-list{display:grid;gap:2px}
.tx{display:flex;align-items:center;gap:12px;padding:10px 4px;border:0;background:none;width:100%;text-align:left;border-radius:14px;color:var(--fg)}
.tx:hover{background:var(--surface2)}
.cat-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,transparent)}
.tx .meta{flex:1;min-width:0}
.tx .meta b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .meta small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:700;font-size:14px;white-space:nowrap}
.amt.in{color:var(--in)}.amt.out{color:var(--fg)}.amt.tf{color:var(--muted)}
.day-h{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);padding:14px 4px 4px;text-transform:uppercase;letter-spacing:.05em}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);vertical-align:1px;margin-left:4px}

/* filters */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span,.seg button{display:block;text-align:center;padding:9px 4px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted);border:0;background:none;width:100%}
.seg input:checked+span,.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.filters{display:grid;grid-template-columns:1fr;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;color:var(--muted)}
.search input{border:0;background:none;outline:none;padding:11px 0;flex:1;min-width:0;color:var(--fg)}
.trace{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:14px;padding:10px 12px;font-size:13px}
.trace span{flex:1;min-width:0}
.trace button{border:0;background:var(--surface);border-radius:10px;padding:6px 10px;font-weight:700;font-size:12px;color:var(--fg)}

/* stats */
.stat-top .v{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1.1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.chip.good{background:var(--in-soft);color:var(--in)}.chip.bad{background:var(--out-soft);color:var(--out)}.chip.neutral{background:var(--surface2);color:var(--muted)}
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:360px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}
.donut-wrap svg{width:150px;height:150px}
.legend{display:grid;gap:10px;min-width:0;width:100%}
.lg{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:13px}
.lg i{width:10px;height:10px;border-radius:3px}
.lg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lg b{font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.insights{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.insight{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-width:0}
.insight small{display:block;color:var(--muted);font-size:12px}
.insight b{display:block;font-size:16px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-rows{display:grid;gap:14px}
.cat-row{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center}
.cat-row .t{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.cat-row .t span:last-child{white-space:nowrap}
.cat-row .bar{height:7px;margin-top:7px}
.cat-row .bar>i{background:var(--cc)}

/* assets */
.worth .v{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.worth .sub{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.worth .sub b{display:block;color:var(--fg);font-size:14px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;margin-top:14px;background:var(--surface2);gap:2px}
.stack i{display:block;height:100%}
.alloc{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:12px;color:var(--muted)}
.alloc span i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.goldcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--gold-soft);border-radius:20px;padding:14px 16px}
.goldcard .g{width:44px;height:44px;border-radius:14px;background:var(--gold);color:var(--surface);display:grid;place-items:center}
.goldcard small{display:block;font-size:12px;color:var(--muted)}
.goldcard b{font-size:16px}
.goldcard button{border:0;background:var(--surface);color:var(--gold);font-weight:700;font-size:12px;padding:8px 10px;border-radius:10px}
.sv{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);color:var(--fg)}
.sv .meta{min-width:0}
.sv .meta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv .meta small{display:block;font-size:12px;color:var(--muted)}
.sv .val{text-align:right;font-weight:700;font-size:14px;white-space:nowrap}
.sv .val small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.sv .bar{grid-column:2/4;height:6px;margin-top:0}
.list{display:grid;gap:10px}

/* empty / demo */
.empty{text-align:center;padding:28px 18px;display:grid;justify-items:center;gap:8px}
.empty .art{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty .art svg{width:30px;height:30px}
.empty h3{font-family:var(--display);margin:6px 0 0;font-size:19px}
.empty p{margin:0;color:var(--muted);max-width:32ch;font-size:14px}
.demo-banner{display:flex;align-items:center;gap:10px;background:var(--gold-soft);color:var(--fg);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.demo-banner span{flex:1}
.demo-banner button{border:0;background:var(--surface);font-weight:700;font-size:12px;border-radius:10px;padding:7px 10px;color:var(--fg);white-space:nowrap}
.skel{border-radius:20px;background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}

/* buttons */
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-fg);text-decoration:none}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:var(--out-soft);color:var(--out)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:64px}
.nav button{border:0;background:none;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:8px 0 10px}
.nav button.on{color:var(--accent)}
.nav .fab{align-self:start;margin-top:-22px}
.nav .fab span{width:58px;height:58px;border-radius:20px;background:var(--hero);color:var(--gold);display:grid;place-items:center;box-shadow:0 8px 20px rgba(30,40,105,.35);transition:transform .15s}
.nav .fab span svg{width:26px;height:26px;stroke-width:2.2}
.nav .fab:active span{transform:scale(.94)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none;align-items:end;grid-template-columns:minmax(0,1fr)}
.sheet.open{display:grid}
.sheet .scrim{position:absolute;inset:0;background:rgba(8,10,25,.45);animation:fadein .2s ease}
.panel{position:relative;width:100%;min-width:0;overflow-x:hidden;max-width:520px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;max-height:92%;overflow:auto;overscroll-behavior:contain;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}

.err{font-size:13px;color:var(--out);margin:0;font-weight:600}

.menu{display:grid;gap:8px}

.swap{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}

/* scan */
.drop{display:grid;justify-items:center;gap:8px;border:2px dashed var(--line);border-radius:20px;padding:26px 16px;text-align:center;color:var(--muted)}

const allOf = kind => { const r=[]; S.docs.forEach((v,k)=>{ if(v&&v.kind===kind) r.push({...v,id:k}); }); return r; };
const allTx = () => allOf("tx").sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.ts||0)-(a.ts||0));
const allSv = () => allOf("sv").sort((a,b)=>(a.ts||0)-(b.ts||0));
const allAcc = () => allOf("acc").sort((a,b)=>(a.ts||0)-(b.ts||0));
const settings = () => S.docs.get("settings") || {};
const svValue = s => s.type==="emas" ? (s.bal||0) * (settings().goldPrice||0) : (s.bal||0);

const sum = arr => arr.reduce((a,t)=>a+(t.amount||0),0);
const hasDemo = () => { for (const v of S.docs.values()) if (v&&v.demo) return true; return false; };
function accBalance(id){
  const a = S.docs.get(id); let b = a ? (a.init||0) : 0;
  S.docs.forEach(t => { if (!t || t.kind!=="tx") return;
    if (t.type==="in" && t.acc===id) b += t.amount||0;
    else if (t.type==="out" && t.acc===id) b -= t.amount||0;
    else if (t.type==="tf"){ if (t.acc===id) b -= t.amount||0; if (t.to===id) b += t.amount||0; } });
  return b;
}
const accFlow = (id, ym) => { let i=0,o=0; allTx().forEach(t => { if (!(t.date||"").startsWith(ym)) return;
  if (t.type==="in"&&t.acc===id) i+=t.amount; else if (t.type==="out"&&t.acc===id) o+=t.amount;
  else if (t.type==="tf"){ if (t.to===id) i+=t.amount; if (t.acc===id) o+=t.amount; } }); return {i,o}; };
const endName = ref => { if (!ref) return "Tanpa rekening"; if (ref.startsWith("sv:")){ const s=S.docs.get(ref.slice(3)); return s? "Tabungan " + s.name : "Tabungan terhapus"; }
  const a = S.docs.get(ref); return a ? a.name : "Rekening terhapus"; };
const touchesAcc = (t, id) => t.acc===id || t.to===id;

/* ---------- storage ---------- */
function saveLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify(Object.fromEntries(S.docs))); }catch(e){} }
function useLocal(){
  S.mode="local"; S.storageBad = !storageOK();
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  try{ const raw = localStorage.getItem(LKEY) || localStorage.getItem(OLDKEY); if (raw) S.docs = new Map(Object.entries(JSON.parse(raw))); }catch(e){}
  S.ready=true; S.anim=true; render();
}
async function put(id, data){
  S.docs.set(id, data); render();
  if (S.mode==="cloud"){ try{ await S.col.doc(id).set(data); }catch(e){ toast(e&&e.code==="quota_exceeded" ? "Penyimpanan penuh. Hapus beberapa catatan lama." : "Gagal menyimpan. Periksa koneksi lalu coba lagi."); } }
  else saveLocal();
}
async function del(id){
  S.docs.delete(id); render();
  if (S.mode==="cloud"){ try{ await S.col.doc(id).delete(); }catch(e){ toast("Gagal menghapus. Coba lagi."); } }
  else saveLocal();

/* render scheduling: never swap the DOM under a finger that is pressing a button */
let pressing = false, pendingRender = false;
document.addEventListener("pointerdown", () => { pressing = true; }, true);
const release = () => { pressing = false; if (pendingRender){ pendingRender = false; setTimeout(render, 0); } };
document.addEventListener("pointerup", () => setTimeout(release, 30), true);
document.addEventListener("pointercancel", release, true);
function scheduleRender(){ if (pressing) pendingRender = true; else render(); }

async function init(){
  render();
  const C = window.claude;
  if (!C || typeof C.use!=="function"){ useLocal(); return; }
  S.samplePromise = C.use("sample"); S.samplePromise.then(s => { S.sample=s; }).catch(()=>{});
  C.use("downloads").then(d => { S.dl=d; }).catch(()=>{});
  let db=null, user=null, id=null;
  try{ [db,user] = await Promise.all([C.use("db"), C.use("user")]); }catch(e){}
  if (db && user){ try{ id = await user.id(); }catch(e){} }
  if (!db || !id){ useLocal(); return; }
  S.mode="cloud";
  S.col = db.collection("data/users/" + id);
  let last = new Map();
  S.col.onSnapshot(snap => {
    const m = new Map(); snap.docs.forEach(d => m.set(d.id, d.data()));
    let changed = !S.ready || m.size !== last.size; if (!S.ready) S.anim = true;
    if (!changed) for (const [k,v] of m){ if (last.get(k) !== v){ changed = true; break; } }
    last = m; S.docs = m; S.ready = true;
    if (changed) scheduleRender();
  }, () => { if (!S.ready) useLocal(); else toast("Sinkronisasi terhenti. Muat ulang halaman."); });
}

  $("#greet").textContent = h<11?"Selamat pagi":h<15?"Selamat siang":h<18?"Selamat sore":"Selamat malam";
  const v = $("#view");
  if (!S.ready){ v.innerHTML = `<div class="skel" style="height:200px"></div><div class="skel" style="height:84px;margin-top:16px"></div><div class="skel" style="height:240px;margin-top:16px"></div>`; return; }
  const anim = S.anim && !reduceMotion; S.anim = false;
  if (!anim) v.classList.remove("enter");
  v.innerHTML = ({home:viewHome, tx:viewTx, stats:viewStats, assets:viewAssets}[S.tab])();
  v.querySelectorAll(".tx-list>.tx,.list>*,.acc-strip>*").forEach((e,i,arr) => e.style.setProperty("--i", Math.min(Array.prototype.indexOf.call(e.parentNode.children, e), 12)));
  if (anim){
    v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter");
    clearTimeout(S.enterT); S.enterT = setTimeout(() => v.classList.remove("enter"), 1600);
    v.querySelectorAll("[data-count]").forEach(countUp);
  }
}
const reduceMotion = (() => { try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } })();
function countUp(el){
  const target = Number(el.dataset.count) || 0; if (!target || (S.hide && el.dataset.priv)) return;
  const t0 = performance.now(), dur = 900;
  const tick = now => { if (!el.isConnected) return; const k = Math.min(1,(now-t0)/dur); const e = 1-Math.pow(1-k,3);
    el.textContent = rp(target*e); if (k<1) requestAnimationFrame(tick); else el.textContent = rp(target); };
  el.textContent = rp(0); requestAnimationFrame(tick);
}

function txListHTML(){
  let list = allTx().filter(t=>(t.date||"").startsWith(S.month));
  if (S.filter!=="all") list = list.filter(t=>t.type===S.filter);
  if (S.accFilter) list = list.filter(t=>touchesAcc(t,S.accFilter));
  const q = S.q.trim().toLowerCase();
  if (q) list = list.filter(t => (t.note||"").toLowerCase().includes(q) || (CAT[t.category]?.n||"").toLowerCase().includes(q) || endName(t.acc).toLowerCase().includes(q) || (t.items||[]).some(i=>(i.name||"").toLowerCase().includes(q)));
  const groups = {}; list.forEach(t => (groups[t.date] ||= []).push(t));
  if (!list.length) return `<div class="empty"><p>${q||S.accFilter||S.filter!=="all"?"Tidak ada transaksi yang cocok.":"Belum ada transaksi bulan ini."}</p></div>`;
  return Object.keys(groups).sort().reverse().map(d => {
    const net = groups[d].reduce((a,t)=>{ if (t.type==="in") return a+t.amount; if (t.type==="out") return a-t.amount;
      if (S.accFilter){ if (t.to===S.accFilter) return a+t.amount; if (t.acc===S.accFilter) return a-t.amount; } return a; },0);
    return `<div class="day-h"><span>${esc(dayLabel(d))}</span><span class="num">${S.hide&&groups[d].some(t=>t.type!=="out") ? hid(net) : (net>0?"+":"")+rp(net)}</span></div>${groups[d].map(t=>txRow(t,S.accFilter)).join("")}`; }).join("");
}

function donut(rows, total, priv){
  const r=54, C=2*Math.PI*r; let acc=0;
  const segs = rows.map(x => { const len = total? x.v/total*C : 0; const g = len>4?2:0;
    const s = `<circle class="donut-seg" cx="75" cy="75" r="${r}" fill="none" stroke="var(${x.c})" stroke-width="20" stroke-dasharray="${Math.max(0,len-g)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 75 75)"/>`; acc+=len; return s; }).join("");
  return `<svg viewBox="0 0 150 150" role="img" aria-label="Komposisi per kategori"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="20"/>${segs}
    <text x="75" y="70" text-anchor="middle" style="font:600 10px var(--body);fill:var(--muted)">Total</text>
    <text x="75" y="88" text-anchor="middle" style="font:800 16px var(--display);fill:var(--fg)">${priv?HS(total):fmtShort(total)}</text></svg>`;
}
function niceTop(mx){ const p = Math.pow(10, Math.floor(Math.log10(mx))); for (const m of [1,2,2.5,5,10]) if (m*p >= mx) return m*p; return 10*p; }
function barsChart(){
  const months = [...Array(6)].map((_,i)=>addMonth(S.month,i-5));
  const data = months.map(m=>({m, i:sum(monthTx(m,"in")), o:sum(monthTx(m,"out"))}));
  const top = niceTop(Math.max(1,...data.map(d=>S.hide ? d.o : Math.max(d.i,d.o))));
  const W=340,H=180,L=42,R=6,T=10,B=24, ph=H-T-B, gw=(W-L-R)/6, bw=Math.min(14,gw/3.2);
  const y = v => T + ph - v/top*ph;
  let g = "";
  [0, top/2, top].forEach(v => { g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v?"3 4":""}"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${fmtShort(v)}</text>`; });
  data.forEach((d,k) => { const cx = L + gw*k + gw/2; const cur = d.m===S.month; const op = t => (S.statType===t?1:.35);
    if (!S.hide) g += `<rect x="${cx-bw-1.5}" y="${y(d.i)}" width="${bw}" height="${Math.max(0,ph+T-y(d.i))}" rx="4" fill="var(--in)" style="--d:${k}" opacity="${op("in")}"><title>Pemasukan ${monthName(d.m)}: ${rp(d.i)}</title></rect>`;
    g += `<rect x="${cx+1.5}" y="${y(d.o)}" width="${bw}" height="${Math.max(0,ph+T-y(d.o))}" rx="4" fill="var(--out)" style="--d:${k}" opacity="${op("out")}"><title>Pengeluaran ${monthName(d.m)}: ${rp(d.o)}</title></rect>`;
    g += `<text x="${cx}" y="${H-7}" text-anchor="middle" style="${cur?"fill:var(--fg);font-weight:700":""}">${monthShort(d.m)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pemasukan dan pengeluaran 6 bulan terakhir">${g}</svg>`;
}
function dailyChart(type){
  const n = daysIn(S.month), arr = Array(n).fill(0);
  monthTx(S.month,type).forEach(t => { arr[Number(t.date.slice(8))-1] += t.amount; });
  const mx = Math.max(1,...arr), W=340,H=110,L=6,R=6,T=8,B=18, ph=H-T-B, bw=(W-L-R)/n;
  const col = type==="in"?"var(--in)":"var(--out)";
  let g = `<line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" stroke="var(--line)"/>`;
  arr.forEach((v,i) => { const h = v/mx*ph; if (v>0) g += `<rect x="${L+i*bw+1}" y="${T+ph-h}" width="${Math.max(1,bw-2)}" height="${h}" rx="2" fill="${col}"><title>Tgl ${i+1}: ${type==="in"?hid(v):rp(v)}</title></rect>`;
    if ([0,9,19,n-1].includes(i)) g += `<text x="${L+i*bw+bw/2}" y="${H-5}" text-anchor="middle">${i+1}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Per hari">${g}</svg>`;
}
function viewStats(){

  const accRows = Object.entries(byAcc).sort((a,b)=>b[1]-a[1]);
  let chip = `<span class="chip neutral">Bulan lalu ${type==="in"?hid(prev):rp(prev)}</span>`;

    chip = `<span class="chip ${good?"good":"bad"}">${d>=0?"▲":"▼"} ${Math.abs(Math.round(d))}% vs bulan lalu</span>`; }
  const now = new Date(); const daysPassed = S.month===ymOf(now) ? now.getDate() : daysIn(S.month);

  const head = `${demoBanner()}<div class="card worth"><small style="color:var(--muted)">Kekayaan bersih</small><div class="v num ${accTotal+svTotal<0?"neg":""}" data-priv="1" data-count="${accTotal+svTotal}">${hid(accTotal+svTotal)}</div>
    <div class="sub"><span>Saldo rekening<b class="num">${hid(accTotal)}</b></span><span>Tabungan & aset<b class="num">${hid(svTotal)}</b></span></div></div>
    <div class="seg sec" style="margin-top:14px"><button type="button" data-act="assetView" data-v="acc" class="${S.assetView==="acc"?"on":""}">Rekening</button><button type="button" data-act="assetView" data-v="sv" class="${S.assetView==="sv"?"on":""}">Tabungan & Emas</button></div>`;
  if (S.assetView==="acc"){
    const ym = ymOf(new Date());

      ${accs.length?`<div class="list">${accs.map(a=>{ const b=accBalance(a.id), f=accFlow(a.id,ym), t=ACCTYPES[a.type]||ACCTYPES.lainnya;
        return `<button type="button" class="acc-row" data-act="openAcc" data-id="${esc(a.id)}">${typeIcon(ACCTYPES,a.type)}<span class="meta"><b>${esc(a.name)}${a.demo?'<span class="badge">contoh</span>':""}</b><small>${esc(t.n)}${a.no?" · •••• "+esc(a.no):""}</small><small class="num">Bulan ini: +${HS(f.i)} / −${fmtShort(f.o)}</small></span><span class="val num ${b<0?"neg":""}">${hid(b)}${a.type==="kartu"&&b<0?"<small>tagihan</small>":""}</span></button>`; }).join("")}</div>
      <button type="button" class="btn ghost block" style="margin-top:12px" data-act="newTx" data-type="tf">${ic("swap")}Transfer antar rekening</button>`
      : `<div class="card empty"><div class="art">${ic("bank")}</div><h3>Belum ada rekening</h3><p>Tambah rekening bank, e-wallet, kartu kredit, atau dompet tunai supaya setiap transaksi bisa ditelusuri asalnya.</p><button type="button" class="btn" data-act="newAcc">${ic("plus")}Tambah rekening</button></div>`}</div>`;
  }
  const gp = settings().goldPrice||0;
  const byType = {}; svs.forEach(s => byType[s.type]=(byType[s.type]||0)+svValue(s));
  const grams = svs.filter(s=>s.type==="emas").reduce((a,s)=>a+(s.bal||0),0);
  const alloc = Object.entries(byType).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  return head + `${alloc.length?`<div class="sec card"><small style="color:var(--muted)">Komposisi tabungan</small><div class="stack">${alloc.map(([k,v])=>`<i style="width:${v/svTotal*100}%;background:var(${(SVTYPES[k]||SVTYPES.lainnya).c})"></i>`).join("")}</div>
    <div class="alloc">${alloc.map(([k,v])=>`<span><i style="background:var(${(SVTYPES[k]||SVTYPES.lainnya).c})"></i>${(SVTYPES[k]||SVTYPES.lainnya).n} ${Math.round(v/svTotal*100)}%</span>`).join("")}</div></div>`:""}
  <div class="sec goldcard"><span class="g">${ic("gold")}</span><span style="min-width:0"><small>Emas · ${HG(grams)}</small><b class="num">${gp?hid(grams*gp):"Harga belum diatur"}</b><small>${gp?`${rp(gp)} / gram`:"Isi harga per gram agar nilai emas terhitung"}</small></span>
    <button type="button" data-act="goldPrice">${gp?"Ubah harga":"Atur harga"}</button></div>
  <div class="sec"><div class="sec-h"><h2>Pos tabungan</h2><button type="button" class="link" data-act="newSv">+ Tambah</button></div>
    ${svs.length ? `<div class="list">${svs.map(svRow).join("")}</div>` :
    `<div class="card empty"><div class="art">${ic("gold")}</div><h3>Belum ada tabungan</h3><p>Catat dana darurat, emas batangan, deposito, atau investasi lain di satu tempat.</p><button type="button" class="btn" data-act="newSv">${ic("plus")}Tambah pos tabungan</button></div>`}
  </div>`;
}
function svRow(s){
  const t = SVTYPES[s.type]||SVTYPES.lainnya, val = svValue(s), gp = settings().goldPrice;

async function toJpeg(file){
  let src, w, h;
  try{ src = await createImageBitmap(file, {imageOrientation:"from-image"}); w = src.width; h = src.height; }
  catch(e){
    src = await new Promise((res, rej) => { const im = new Image(); const u = URL.createObjectURL(file); im.onload = () => res(im); im.onerror = () => rej(new Error("decode")); im.src = u; });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  if (!w || !h) throw new Error("decode");
  const k = Math.min(1, 1800 / Math.max(w, h)); const c = document.createElement("canvas");
  c.width = Math.round(w*k); c.height = Math.round(h*k);
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(src, 0, 0, c.width, c.height);
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("encode")), "image/jpeg", 0.85));
}

const STANDALONE = !(window.claude && typeof window.claude.use === "function");
let tessLoading = null;
function loadTesseract(){
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  return tessLoading ||= new Promise((res, rej) => { const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    sc.onload = () => window.Tesseract ? res(window.Tesseract) : rej(new Error("load")); sc.onerror = () => { tessLoading = null; rej(new Error("load")); };
    document.head.appendChild(sc); });
}
let ocrWorker = null;
async function ocrText(blob, onProg){
  const T = await loadTesseract();
  if (!ocrWorker) ocrWorker = await T.createWorker("ind+eng", 1, { logger: m => { if (m && m.status==="recognizing text" && onProg) onProg(m.progress); } });
  const { data } = await ocrWorker.recognize(blob);
  return data.text || "";
}
function parseReceipt(text){
  const lines = text.split(/\n/).map(l => l.replace(/\s+/g," ").trim()).filter(Boolean);
  const numRe = /(\d{1,3}(?:[.,]\d{3})+|\d{4,})(?:[.,]\d{2})?(?!\d)/g;
  const lastNum = l => { const m = [...l.matchAll(numRe)]; return m.length ? rpNum(m[m.length-1][0]) : 0; };
  const bad = /(sub\s*-?total|total\s*(item|qty|disc|diskon|hemat)|diskon|hemat|kembali|change|ppn|dpp|pajak|tax|tunai|cash|bayar\s*tunai)/i;
  let total = 0;
  const grand = lines.find(l => /(grand\s*total|total\s*bayar|total\s*belanja|total\s*harga|jumlah\s*bayar|netto)/i.test(l) && lastNum(l));
  if (grand) total = lastNum(grand);
  if (!total){ const t = lines.find(l => /\btotal\b|\bjumlah\b/i.test(l) && !bad.test(l) && lastNum(l)); if (t) total = lastNum(t); }
  if (!total){ const stop = lines.findIndex(l => /(tunai|cash|kembali|change)/i.test(l)); const pool = (stop>0 ? lines.slice(0,stop) : lines);
    total = Math.max(0, ...pool.map(lastNum).filter(n => n < 1e8)); }
  let date = null;
  for (const l of lines){
    let m = l.match(/(20\d{2})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
    if (m){ date = `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`; break; }
    m = l.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if (m){ let y = +m[3]; if (y<100) y += 2000; const d = +m[1], mo = +m[2]; if (mo>=1 && mo<=12 && d>=1 && d<=31){ date = `${y}-${pad(mo)}-${pad(d)}`; break; } }
  }
  const merchant = (lines.find(l => (l.match(/[a-z]/gi)||[]).length >= 4 && !/(jl\.?|jalan|telp|npwp|struk|kasir|tanggal)/i.test(l)) || "").slice(0,60);
  const items = [];
  for (const l of lines){
    if (items.length >= 25) break;
    const m = l.match(/^(.*?[a-z]{2,}.*?)\s+(?:(\d{1,3})\s*[xX@]?\s+)?(?:\d{1,3}(?:[.,]\d{3})+\s+)?(\d{1,3}(?:[.,]\d{3})+)$/i);
    if (m && !/(total|jumlah|tunai|cash|kembali|ppn|diskon|hemat|bayar|harga jual|dpp|npwp)/i.test(m[1])) items.push({name:m[1].replace(/[^\w\s&.\-\/]/g,"").trim().slice(0,60), qty:+m[2]||1, price:rpNum(m[3])});
  }
  const all = text.toLowerCase();
  const catMap = [["belanja",/(indomaret|alfamart|alfamidi|supermarket|hypermart|superindo|giant|lottemart|transmart|minimarket)/],["makan",/(resto|restoran|cafe|kafe|kopi|coffee|bakso|mie|ayam|rumah makan|\brm\b|warung|warteg|padang|bakery|roti|pizza|burger|kfc|mcd)/],
    ["transport",/(spbu|pertamina|shell|bensin|pertalite|pertamax|parkir|tol\b|grab|gojek)/],["kesehatan",/(apotek|apotik|farma|klinik|obat|rumah sakit)/],
    ["tagihan",/(pln|listrik|telkom|indihome|pulsa|pdam|token)/],["hiburan",/(bioskop|cinema|xxi|cgv|tiket)/],["pendidikan",/(buku|gramedia|sekolah|kursus)/],
    ["belanja",/(indomaret|alfamart|alfamidi|supermarket|hypermart|superindo|giant|lottemart|transmart|minimarket|toko)/]];
  const category = (catMap.find(([,re]) => re.test(all)) || ["belanja"])[0];
  const method = /(gopay|ovo|dana\b|shopeepay|linkaja)/.test(all) ? "ewallet" : /(kartu kredit|credit|visa|master)/.test(all) ? "kartu" : /(debit|qris|transfer|edc)/.test(all) ? "bank" : /(tunai|cash)/.test(all) ? "tunai" : null;
  return {merchant, date, total, category, method, items};
}

const rpNum = v => { if (typeof v==="number") return Math.round(v)||0; const str = String(v??"").trim().replace(/[,.]\d{1,2}$/,""); return Number(str.replace(/\D/g,""))||0; };

      sampling_disabled:"Pembacaan otomatis tidak tersedia untuk akun ini.",

      image_rejected:"Foto ditolak (format atau ukuran). Pilih foto lain.",

    out.push({type:"out",category:"rumah",amount:1800000,date:d(2),acc:A.bank,note:"Bayar kos"});
    out.push({type:"out",category:"tagihan",amount:Math.round((300+rnd()*150))*1000,date:d(5),acc:A.bank,note:"Listrik & internet"});
    out.push({type:"out",category:"sedekah",amount:150000,date:d(6),acc:A.cash,note:"Infaq masjid"});
    out.push({type:"tf",amount:1000000,date:d(3),acc:A.bank,to:A.cash,note:"Tarik tunai ATM"});
    out.push({type:"tf",amount:300000,date:d(4),acc:A.bank,to:A.ew,note:"Isi saldo e-wallet"});
    out.push({type:"out",category:"tagihan",amount:2500,date:d(4),acc:A.bank,note:"Biaya transfer"});
    if (k>0) out.push({type:"tf",amount:600000,date:d(20),acc:A.bank,to:A.cc,note:"Bayar tagihan kartu kredit"});
    for (let j=0;j<4;j++){ const t = pick(T); out.push({type:"out",category:t[0],amount:Math.round((t[2]+rnd()*(t[3]-t[2]))/500)*500,date:d(3+Math.floor(rnd()*26)),acc:pick(t[4]),note:pick(t[1])}); }
  }
  out.filter(t=>t.date<=today()).forEach(t => docs.push([uid("t_"), {kind:"tx",...t,ts:now+n++,demo:true}]));
  const sv = [["Dana darurat","bank",12500000,20000000],["Emas Antam","emas",7.5,0],["Reksa dana pasar uang","investasi",4200000,10000000]];
  sv.forEach(([name,type,bal,target])=>docs.push([uid("s_"),{kind:"sv",name,type,bal,target,ts:now+n++,hist:[{d:today(),a:bal,n:"Saldo awal"}],demo:true}]));
  return docs;
}

/* ---------- actions ---------- */
function confirmBtn(el){ if (el.dataset.sure) return true; el.dataset.sure="1"; el.textContent="Yakin hapus?"; el.style.whiteSpace="nowrap"; setTimeout(()=>{ if (el.isConnected && el.dataset.sure){ delete el.dataset.sure; el.innerHTML=ic("trash"); } },4000); return false; }
function go(tab){ S.tab = tab; S.anim = true; closeSheet(); render(); window.scrollTo({top:0}); }

function handle(el){
  const a = el.dataset.act, id = el.dataset.id;
  switch(a){
    case "close": closeSheet(); break;
    case "add": addMenu(); break;
    case "tab": go(el.dataset.tab); break;
    case "goAssets": S.assetView = el.dataset.v||"acc"; go("assets"); break;
    case "assetView": S.assetView = el.dataset.v; S.anim = true; render(); break;
    case "prevMonth": S.month = addMonth(S.month,-1); S.anim = true; render(); break;
    case "nextMonth": if (S.month < ymOf(new Date())){ S.month = addMonth(S.month,1); S.anim = true; render(); } break;
    case "filter": S.filter = el.dataset.f; render(); break;
    case "clearAccFilter": S.accFilter = ""; render(); break;
    case "statType": S.statType = el.dataset.t; S.anim = true; render(); break;
    case "newTx": txForm({type:el.dataset.type||"out"}); break;
    case "newTxFrom": { const ty = el.dataset.type; txForm(ty==="in"?{type:"in",acc:id}:ty==="tf"?{type:"tf",acc:id}:{type:"out",acc:id}); break; }
    case "editTx": { const t = S.docs.get(id); if (t) txForm({...t,id}); break; }
    case "delTx": if (confirmBtn(el)) deleteTx(id); break;
    case "newAccInline": S.draft = readTxDraft(); accForm({}, true); break;
    case "newAcc": accForm({}); break;
    case "openAcc": accDetail(id); break;
    case "editAcc": { const x = S.docs.get(id); if (x) accForm({...x,id}); break; }
    case "delAcc": if (confirmBtn(el)){ const n = allTx().filter(t=>touchesAcc(t,id)).length; del(id); if (S.accFilter===id) S.accFilter=""; closeSheet(); toast(n?`Rekening dihapus. ${n} transaksi kini tanpa rekening.`:"Rekening dihapus."); } break;
    case "traceAcc": S.accFilter = id; S.filter = "all"; const fst = allTx().find(t=>touchesAcc(t,id)); if (fst && !fst.date.startsWith(S.month)) S.month = fst.date.slice(0,7); go("tx"); break;
    case "scan": scanSheet(); break;
    case "readReceipt": readReceipt(); break;
    case "newSv": svForm({}); break;
    case "openSv": svDetail(id); break;
    case "editSv": { const s = S.docs.get(id); if (s) svForm({...s,id}); break; }
    case "delSv": if (confirmBtn(el)){ del(id); closeSheet(); toast("Pos tabungan dihapus."); } break;
    case "goldPrice": settingsSheet(true); break;
    case "settings": settingsSheet(false); break;
    case "loadDemo": loadDemo(); break;
    case "clearDemo": clearDemo(); break;
    case "export": closeSheet(); exportCSV(); break;
    case "backup": closeSheet(); backupData(); break;
    case "confirmRestore": confirmRestore(); break;
    case "toggleHide": S.hide = !S.hide; try{ localStorage.setItem(HKEY, S.hide?"1":"0"); }catch(e){} render(); toast(S.hide?"Saldo, tabungan & pemasukan disembunyikan.":"Semua nominal ditampilkan."); break;
    case "copyLink": (async () => { try{ await navigator.clipboard.writeText(APP_URL); toast("Tautan disalin. Tempel di Chrome."); }
      catch(e){ const c = document.querySelector(".applink"); if (c){ const r = document.createRange(); r.selectNodeContents(c); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast("Tekan lama tautan di bawah untuk menyalin."); } })(); break;
  }
}
function deleteTx(id){
  const t = S.docs.get(id); if (!t) return;
  if (t.type==="tf" && t.sv && t.svDelta){ const s = S.docs.get(t.sv); if (s){ const ns = {...s, bal: Math.round(((s.bal||0)-t.svDelta)*1000)/1000, hist:[...(s.hist||[]), {d:today(), a:-t.svDelta, n:"Dibatalkan"}].slice(-60)}; put(t.sv, ns); } }
  if (t.feeId && S.docs.get(t.feeId)) del(t.feeId);
  del(id); closeSheet(); toast("Transaksi dihapus.");
}

document.addEventListener("click", e => {

function ensureAcc(v){
  if (v && v!=="__auto") return v;
  const id = uid("a_"); put(id, {kind:"acc", name:"Dompet Tunai", type:"tunai", init:0, ts:Date.now()}); toast("Rekening Dompet Tunai dibuat."); return id;
}
document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target; const fid = f.getAttribute("id"); const fd = new FormData(f);
  const showErr = (sel,msg) => { const er=$(sel); er.textContent=msg; er.hidden=false; };
  if (fid==="txForm"){
    const amount = parseRp(fd.get("amount")), type = fd.get("type");
    if (amount<=0) return showErr("#txErr","Isi nominal lebih dari Rp 0.");
    const id = fd.get("rid") || uid("t_"); const prev = S.docs.get(id) || {};
    const date = fd.get("date") || today(), note = String(fd.get("note")||"").trim();
    let doc;
    if (type==="tf"){
      const from = fd.get("acc"), to = fd.get("to");
      if (!from || !to || from==="__auto" || to==="__auto") return showErr("#txErr","Pilih rekening asal dan tujuan.");
      if (from===to) return showErr("#txErr","Rekening asal dan tujuan harus berbeda.");
      doc = {kind:"tx", type:"tf", amount, acc:from, to, date, note, ts:prev.ts||Date.now()};
      const fee = parseRp(fd.get("fee"));
      if (fee>0){ const feeId = prev.feeId || uid("t_"); doc.fee = fee; doc.feeId = feeId;
        put(feeId, {kind:"tx", type:"out", amount:fee, category:"tagihan", acc:from, date, note:"Biaya admin transfer", ts:Date.now(), feeOf:id}); }
      else if (prev.feeId){ del(prev.feeId); }
    } else {
      const acc = ensureAcc(fd.get("acc"));
      doc = {kind:"tx", type, amount, category:fd.get("cat"), acc, date, note, ts:prev.ts||Date.now()};
      if (S.formItems && S.formItems.length) doc.items = S.formItems; else if (prev.items) doc.items = prev.items;
      if (S.formScanned || prev.scanned) doc.scanned = true;
      if (prev.feeOf) doc.feeOf = prev.feeOf;
    }
    if (prev.demo) doc.demo = true;
    put(id, doc); closeSheet(); toast(fd.get("rid")?"Perubahan disimpan.":type==="tf"?"Transfer tercatat.":"Transaksi tersimpan.");
    if (!date.startsWith(S.month)){ S.month = date.slice(0,7); render(); }
  }
  if (fid==="accForm"){
    const name = String(fd.get("name")||"").trim(); if (!name) return showErr("#accErr","Beri nama rekening.");
    const type = fd.get("type"); const init = parseRp(fd.get("init")) * (type==="kartu" ? -1 : 1);
    const id = fd.get("rid") || uid("a_"); const prev = S.docs.get(id) || {};
    const doc = {kind:"acc", name, type, init, no:String(fd.get("no")||"").slice(0,4), ts:prev.ts||Date.now()};
    if (prev.demo) doc.demo = true;
    put(id, doc);
    if (fd.get("back") && S.draft){ const d = S.draft; S.draft = null; if (d.type==="tf"){ if (!d.acc||d.acc==="__auto") d.acc=id; else d.to=id; } else d.acc = id; txForm(d); }
    else { closeSheet(); toast(fd.get("rid")?"Rekening diperbarui.":"Rekening ditambahkan."); }
  }
  if (fid==="svForm"){
    const type = fd.get("type"), name = String(fd.get("name")||"").trim();
    const bal = type==="emas" ? parseDec(fd.get("bal")) : parseRp(fd.get("bal"));
    if (!name) return showErr("#svErr","Beri nama pos tabungan.");
    const id = fd.get("rid") || uid("s_"); const prev = S.docs.get(id) || {};
    const hist = (prev.hist||[]).slice(); const diff = bal - (prev.bal||0);
    if (!prev.kind || prev.type!==type){ hist.length=0; if (bal) hist.push({d:today(),a:bal,n:"Saldo awal"}); }
    else if (diff) hist.push({d:today(),a:diff,n:"Koreksi saldo"});
    const doc = {kind:"sv", name, type, bal, target:parseRp(fd.get("target")), ts:prev.ts||Date.now(), hist:hist.slice(-60)};
    if (prev.demo) doc.demo = true;
    put(id, doc); closeSheet(); toast("Tabungan tersimpan.");
  }
  if (fid==="moveForm"){
    const id = fd.get("rid"), s = S.docs.get(id); if (!s) return; const gold = s.type==="emas";
    const amt = gold ? parseDec(fd.get("amt")) : parseRp(fd.get("amt")); const dir = Number(fd.get("dir"));
    const acc = fd.get("acc"); const money = gold ? parseRp(fd.get("rp")) : amt;
    if (amt<=0) return showErr("#mvErr", gold?"Isi berat emas dalam gram.":"Isi jumlah yang disetor atau ditarik.");
    if (dir<0 && amt > (s.bal||0)+1e-9) return showErr("#mvErr","Penarikan melebihi saldo tabungan.");
    if (acc && acc!=="__auto" && money<=0) return showErr("#mvErr","Isi nominal Rp yang dipindahkan dari/ke rekening.");
    const delta = Math.round(dir*amt*1000)/1000;
    let note = String(fd.get("note")||"").trim();
    if (acc && acc!=="__auto"){
      const txId = uid("t_"); const svRef = "sv:"+id;
      put(txId, {kind:"tx", type:"tf", amount:money, acc: dir>0?acc:svRef, to: dir>0?svRef:acc, sv:id, svDelta:delta, date:today(), note: note || (dir>0?"Setor ke "+s.name:"Tarik dari "+s.name), ts:Date.now()});
      note = (note?note+" · ":"") + (dir>0?"dari ":"ke ") + endName(acc);
    }
    const doc = {...s, bal: Math.round(((s.bal||0) + delta)*1000)/1000, hist:[...(s.hist||[]), {d:today(), a:delta, n:note}].slice(-60)};
    put(id, doc); svDetail(id); toast(dir>0?"Setoran dicatat.":"Penarikan dicatat.");
  }
  if (fid==="setForm"){
    const doc = {...settings(), kind:"settings", budget:parseRp(fd.get("budget")), goldPrice:parseRp(fd.get("goldPrice"))};
    put("settings", doc); closeSheet(); toast("Pengaturan disimpan.");
  }
});

/* ---------- files: export, backup, restore ---------- */
const CAP = (window.Capacitor && typeof window.Capacitor.isNativePlatform==="function" && window.Capacitor.isNativePlatform()) ? window.Capacitor : null;
const plug = n => (CAP && CAP.Plugins && CAP.Plugins[n]) || null;
async function saveFile(filename, data, mime){
  if (CAP && plug("Filesystem") && plug("Share")){
    const r = await plug("Filesystem").writeFile({path:filename, data, directory:"CACHE", encoding:"utf8"});
    await plug("Share").share({title:filename, url:r.uri, dialogTitle:"Simpan atau kirim file"});
    return "shared";
  }
  if (S.dl){ await S.dl.save({filename, data}); return "saved"; }
  if (STANDALONE){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data],{type:mime})); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); return "downloaded"; }
  throw new Error("unavailable");
}
async function exportCSV(){
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const rows = [["Tanggal","Jenis","Kategori","Nominal","Rekening","Ke rekening","Catatan"].join(",")].concat(
    allTx().map(t=>[t.date, t.type==="in"?"Pemasukan":t.type==="out"?"Pengeluaran":"Transfer", t.type==="tf"?"":(CAT[t.category]?.n||""), t.amount,
      t.acc?endName(t.acc):(LEGACY_METHODS[t.method]||""), t.type==="tf"?endName(t.to):"", t.note].map(q).join(",")));
  const data = "﻿"+rows.join("\n");
  try{ const r = await saveFile(`financial-freedom-${today()}.csv`, data, "text/csv"); if (r==="downloaded") toast("File CSV diunduh."); }
  catch(e){ if (e && e.message==="unavailable"){ try{ await navigator.clipboard.writeText(data); toast("Unduhan tidak tersedia di sini. Data CSV disalin ke clipboard."); }catch(_){ toast("Unduhan tidak tersedia di tampilan ini."); } } else toast("Ekspor dibatalkan."); }
}
async function backupData(){
  const docs = {}; S.docs.forEach((v,k)=>{ docs[k]=v; });
  const data = JSON.stringify({app:"financial-freedom", version:1, exported:new Date().toISOString(), docs});
  try{
    const r = await saveFile(`cadangan-financial-freedom-${today()}.json`, data, "application/json");
    try{ localStorage.setItem("ff-last-backup", today()); }catch(_){}
    if (r==="downloaded") toast("File cadangan tersimpan di folder Download.");
    render();
  }catch(e){ toast(e && e.message==="unavailable" ? "Cadangan tidak bisa disimpan di tampilan ini." : "Cadangan dibatalkan."); }
}
async function readBackup(file){
  let obj;
  try{ obj = JSON.parse(await file.text()); }catch(e){ toast("File tidak bisa dibaca. Pilih file cadangan .json dari Financial Freedom."); return; }
  if (!obj || obj.app!=="financial-freedom" || !obj.docs || typeof obj.docs!=="object"){ toast("Ini bukan file cadangan Financial Freedom."); return; }
  const entries = Object.entries(obj.docs).filter(([k,v]) => v && typeof v==="object" && ["tx","acc","sv","settings"].includes(v.kind));
  const n = {tx:0,acc:0,sv:0}; entries.forEach(([,v]) => { if (n[v.kind]!==undefined) n[v.kind]++; });
  S.pendingRestore = entries;
  openSheet("Pulihkan data", `<div class="form">
    <div class="card" style="box-shadow:none;background:var(--surface2)"><small style="color:var(--muted)">Cadangan tanggal ${esc((obj.exported||"").slice(0,10))}</small>
      <div style="font-weight:700;margin-top:4px">${n.acc} rekening · ${n.tx} transaksi · ${n.sv} pos tabungan</div></div>
    <p class="hint">${S.mode==="cloud" ? "Isi cadangan akan ditambahkan ke data di akunmu. Catatan dengan kode yang sama akan ditimpa." : "Semua data di aplikasi ini akan <b>diganti</b> dengan isi cadangan."}</p>
    <button type="button" class="btn block" data-act="confirmRestore">Pulihkan sekarang</button>
    <button type="button" class="btn ghost block" data-act="close">Batal</button></div>`);
}
async function confirmRestore(){
  const entries = S.pendingRestore; if (!entries || busy) return; busy = true; S.pendingRestore = null; closeSheet();
  if (S.mode==="cloud"){
    entries.forEach(([k,v]) => S.docs.set(k,v)); render(); toast("Memulihkan data…");
    for (const [k,v] of entries){ try{ await S.col.doc(k).set(v); }catch(e){ toast("Sebagian data gagal dipulihkan."); break; } }
  } else { S.docs = new Map(entries); saveLocal(); render(); }
  busy = false; S.anim = true; render(); toast("Data berhasil dipulihkan.");
}
function storageOK(){ try{ const k="ff-test"; localStorage.setItem(k,"1"); const ok = localStorage.getItem(k)==="1"; localStorage.removeItem(k); return ok; }catch(e){ return false; } }
function backupReminder(){
  if (S.mode!=="local" || !allTx().length) return "";
  if (S.storageBad) return `<div class="demo-banner" style="background:var(--out-soft)">${ic("x")}<span><b>Data tidak bisa disimpan di sini.</b> Semua catatan akan hilang saat aplikasi ditutup. Pasang sebagai aplikasi atau buka lewat Chrome.</span></div>`;
  let last = null; try{ last = localStorage.getItem("ff-last-backup"); }catch(e){}
  const days = last ? Math.floor((Date.now() - new Date(last).getTime())/864e5) : null;
  if (days!==null && days < 14) return "";
  return `<div class="demo-banner">${ic("download")}<span>${last?`Cadangan terakhir ${days} hari lalu.`:"Datamu belum pernah dicadangkan."} Simpan cadangan agar aman jika HP hilang atau rusak.</span><button type="button" data-act="backup">Cadangkan</button></div>`;
}

/* Android hardware back button inside the installed app */
if (plug("App")) plug("App").addListener("backButton", () => {
  if ($("#sheet").classList.contains("open")) closeSheet();
  else if (S.tab!=="home") go("home");
  else plug("App").exitApp();
});

init();
})();
