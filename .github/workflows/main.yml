name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cari file proyek
        run: |
          if [ ! -f package.json ]; then
            DIR=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -n 1)")
            if [ -n "$DIR" ] && [ "$DIR" != "." ] && [ -f "$DIR/package.json" ]; then
              echo "Proyek ditemukan di $DIR"
              cp -r "$DIR"/. .
            fi
          fi
          if [ ! -f package.json ] || [ ! -d www ]; then
            echo "::error::package.json atau folder www belum di-upload. Upload isi folder financial-freedom-app ke repository."
            exit 1
          fi
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependensi
        run: npm install

      - name: Siapkan proyek Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android || echo "Ikon bawaan dipakai"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MANIFEST" || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' "$MANIFEST"
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ganti nama file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk financial-freedom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: financial-freedom-apk
          path: financial-freedom.apk
