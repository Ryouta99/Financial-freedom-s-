name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Siapkan file proyek (bongkar ZIP kalau ada)
        shell: bash
        run: |
          # Pakai ZIP financial-freedom-app*.zip yang paling baru di-upload, kalau ada.
          ZIP=""; NEWEST=0
          while IFS= read -r -d '' f; do
            T=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0); T=${T:-0}
            if [ "$T" -ge "$NEWEST" ]; then NEWEST=$T; ZIP="$f"; fi
          done < <(find . -maxdepth 3 -iname 'financial-freedom-app*.zip' -not -path './.git/*' -print0)
          if [ -n "$ZIP" ]; then
            echo "Membongkar $ZIP"
            rm -rf _zip && mkdir _zip && unzip -q -o "$ZIP" -d _zip
            DIR=$(dirname "$(find _zip -name build.py | head -n 1)")
            if [ -f "$DIR/build.py" ]; then cp -r "$DIR"/. .; echo "Proyek dari ZIP dipakai"; fi
          fi
          # Kalau tidak ada ZIP, cari proyek di dalam subfolder.
          if [ ! -f build.py ]; then
            DIR=$(dirname "$(find . -name build.py -not -path './.git/*' -not -path '*/node_modules/*' | head -n 1)")
            if [ -n "$DIR" ] && [ "$DIR" != "." ] && [ -f "$DIR/build.py" ]; then cp -r "$DIR"/. .; echo "Proyek ditemukan di $DIR"; fi
          fi
          if [ ! -f build.py ] || [ ! -d src ]; then
            echo "::error::Proyek belum lengkap. Upload file financial-freedom-app.zip terbaru ke repository."
            exit 1
          fi
          grep -o '"version": *"[^"]*"' package.json

      - name: Gabungkan kode (build.py)
        run: python3 build.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependensi
        run: npm install

      - name: Siapkan proyek Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android || echo "Ikon bawaan dipakai"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MANIFEST" || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' "$MANIFEST"
          grep -q 'WRITE_EXTERNAL_STORAGE' "$MANIFEST" || sed -i 's#<uses-permission android:name="android.permission.CAMERA" />#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />#' "$MANIFEST"
          npx cap sync android

      - name: Pakai kunci tanda tangan tetap
        run: |
          mkdir -p ~/.android
          if [ -f keystore/debug.keystore ]; then cp keystore/debug.keystore ~/.android/debug.keystore; echo "Kunci tetap dipakai"; fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ganti nama file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk financial-freedom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: financial-freedom-apk
          path: financial-freedom.apk
